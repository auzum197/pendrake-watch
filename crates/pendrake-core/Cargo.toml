[package]
name = "pendrake-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pendrake core: zingolib watch-only wallet construction and wallet-file lifecycle."

[dependencies]
pendrake-ipc = { path = "../pendrake-ipc" }

zingolib = { git = "https://github.com/auzum197/zingolib", branch = "stable-auz" }
pepper-sync = { git = "https://github.com/auzum197/zingolib", branch = "stable-auz" }

zingo-netutils = "5.0.1"

# The zakura generation: the zcash_* crates renamed for the Nu7 era, matching the
# stack zingolib stable-auz builds against. Same lib names, so the import paths
# below are unchanged.
zcash_protocol = { version = "=4.0.0-rc1", package = "zakura-protocol" }
zcash_primitives = { version = "=4.0.0-rc1", package = "zakura-primitives" }
zcash_address = { version = "=4.0.0-rc1", package = "zakura-address" }

zcash_client_backend = { git = "https://github.com/zakura-core/wallet-libraries", rev = "a2f87e6f235dc16840be1dd7fc88e6dd06f0a268", package = "zakura-client-backend", default-features = false, features = [
    "lightwalletd-tonic",
    "orchard",
    "transparent-inputs",
] }
zcash_keys = { version = "=4.0.0-rc1", package = "zakura-keys", default-features = false, features = [
    "transparent-inputs",
    "sapling",
    "orchard",
] }

zip32 = "0.2"
# Hashes the canonical UFVK encoding into a stable fingerprint.
sha2 = "0.10"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
serde.workspace = true
serde_json.workspace = true
http = "1"
anyhow.workspace = true
dirs = "5"
tracing.workspace = true
rustls = { version = "0.23", features = ["ring"] }
# Keyless HTTPS to the fiat price providers (AUZ-83). rustls-tls reuses the ring provider
# already installed at startup instead of pulling native-tls / OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
fs2 = "0.4"
# Wipes the session passphrase and every request line that could carry it.
zeroize = "1"
thiserror = "1"
# Status codes off GrpcIndexer's GetBlock errors (the "no such block" whitelist in
# fetch_block_hash), and Status construction in the classifier tests. Same version
# track as zingo-netutils so the types unify.
tonic = "0.14"

[dev-dependencies]
# Isolated data dir per single-instance test, cleaned up on drop.
tempfile = "3"
# ConfirmationStatus, to stamp the hand-built TransactionSummary fixtures the
# net-delta tests work from.
zingolib-common = { git = "https://github.com/auzum197/zingolib", branch = "stable-auz" }

