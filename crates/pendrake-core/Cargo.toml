[package]
name = "pendrake-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pendrake core: zingolib watch-only wallet construction and wallet-file lifecycle."

[dependencies]
pendrake-ipc = { path = "../pendrake-ipc" }

zingolib = { git = "https://github.com/auzum197/zingolib", branch = "stable-auz" }
pepper-sync = { git = "https://github.com/auzum197/zingolib", branch = "stable-auz" }
# GrpcIndexer + the Indexer trait, to probe a candidate Indexer with a real
# GetLightdInfo call before saving it. Same version track as zingolib's workspace so
# the GrpcIndexer/tonic types unify.
zingo-netutils = "5"
# Versions track zingolib's workspace so shared types unify (one zcash_protocol).
zcash_protocol = "0.9"
# TxId, carried by the sync events and accepted by transaction_summary.
zcash_primitives = "0.28"
# UFVK decoding for the identity slice: network, pools, and fingerprint off the key.
zcash_address = "0.12"
zip32 = "0.2"
# Hashes the canonical UFVK encoding into a stable fingerprint.
sha2 = "0.10"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
serde.workspace = true
serde_json.workspace = true
# zingolib's address accessors return the json-rust crate's JsonValue.
json = "0.12"
http = "1"
anyhow.workspace = true
dirs = "5"
tracing.workspace = true
rustls = { version = "0.23", features = ["ring"] }
# Keyless HTTPS to the fiat price providers (AUZ-83). rustls-tls reuses the ring provider
# already installed at startup instead of pulling native-tls / OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
fs2 = "0.4"
thiserror = "1"

[dev-dependencies]
# Constructs tonic::Status values so the sync-error classifier (is_unreachable) is
# tested against the real RequestFailed transport-failure variant.
tonic = "0.14"
# Isolated data dir per single-instance test, cleaned up on drop.
tempfile = "3"
# ConfirmationStatus, to stamp the hand-built TransactionSummary fixtures the
# net-delta tests feed through map_tx. Pinned to the version zingolib links so the
# type unifies (a git copy resolves to a distinct, incompatible ConfirmationStatus).
zingo-status = "0.2"
