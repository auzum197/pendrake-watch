[package]
name = "pendrake-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pendrake core: zingolib watch-only wallet construction and wallet-file lifecycle."

[dependencies]
pendrake-ipc = { path = "../pendrake-ipc" }

zingolib = { git = "https://github.com/auzum197/zingolib", branch = "chore/add-ironwood" }
pepper-sync = { git = "https://github.com/auzum197/zingolib", branch = "chore/add-ironwood" }

zingo-netutils = "5"

zcash_protocol   = "=0.10.0"
zcash_primitives = "=0.29.0"
zcash_address    = "=0.13.0"

zcash_client_backend = { version = "=0.24.0-rc.1", default-features = false, features = ["lightwalletd-tonic", "orchard", "transparent-inputs"] }
zcash_keys = { version = "=0.15.0", default-features = false, features = ["transparent-inputs", "sapling", "orchard"] }

zip32 = "0.2"
# Hashes the canonical UFVK encoding into a stable fingerprint.
sha2 = "0.10"

tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }
serde.workspace = true
serde_json.workspace = true
# zingolib's address accessors return the json-rust crate's JsonValue.
json = "0.12"
http = "1"
anyhow.workspace = true
dirs = "5"
tracing.workspace = true
rustls = { version = "0.23", features = ["ring"] }
# Keyless HTTPS to the fiat price providers (AUZ-83). rustls-tls reuses the ring provider
# already installed at startup instead of pulling native-tls / OpenSSL.
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
] }
fs2 = "0.4"
thiserror = "1"
# Status codes off GrpcIndexer's GetBlock errors (the "no such block" whitelist in
# fetch_block_hash), and Status construction in the classifier tests. Same version
# track as zingo-netutils so the types unify.
tonic = "0.14"

[dev-dependencies]
# Isolated data dir per single-instance test, cleaned up on drop.
tempfile = "3"
# ConfirmationStatus, to stamp the hand-built TransactionSummary fixtures the
# net-delta tests feed through map_tx. Pinned to the version zingolib links so the
# type unifies (a git copy resolves to a distinct, incompatible ConfirmationStatus).
zingo-status = "0.2"