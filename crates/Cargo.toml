[workspace]
resolver = "2"
members = ["pendrake-ipc", "pendrake-core", "pendrake-daemon", "pendrake-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"

# Lazy gRPC connect so opening a wallet works offline: GrpcIndexer::new defers the
# connection to the first RPC instead of dialing at construction. zingolib's stable-auz
# carries the same patch, but Cargo ignores [patch] from non-root manifests, so we
# mirror it here for our own build (auzum197/zingo-common#1).
[patch.crates-io]
zingo-netutils = { git = "https://github.com/auzum197/zingo-common", branch = "dev" }
