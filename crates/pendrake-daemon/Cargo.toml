[package]
name = "pendrake-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pendrake background daemon: owns the wallet file and serves the GUI over a Unix socket."

[[bin]]
name = "pendraked"
path = "src/main.rs"

[dependencies]
pendrake-core = { path = "../pendrake-core" }

# Runtime only for the `call` debug client; the engine owns its own in run().
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Desktop notifications on Linux/Windows. macOS uses the Swift helper instead.
notify-rust = "4"
