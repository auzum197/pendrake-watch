[package]
name = "pendrake-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Pendrake background daemon: owns the wallet file and serves the GUI over a Unix socket."

[[bin]]
name = "pendraked"
path = "src/main.rs"

[dependencies]
pendrake-core = { path = "../pendrake-core" }

# Runtime only for the `call` debug client; the engine owns its own in run().
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util"] }
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Desktop notifications. Linux and macOS use notify-rust. Windows builds the
# toast directly so the click can use protocol activation (the WinRT crate's only
# click hook is an in-process callback a parked daemon can't dispatch). (On macOS
# the daemon is a dev or headless host. Production macOS uses the Swift helper.)
[target.'cfg(not(target_os = "windows"))'.dependencies]
notify-rust = "4"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Data_Xml_Dom",
    "UI_Notifications",
    # Creating the Start Menu shortcut that carries our AUMID so toasts render.
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
# Register our own AppUserModelID so toasts show as "Pendrake" with our icon
# instead of borrowing PowerShell's identity.
winreg = "0.52"
