[package]
name = "pendrake-watch"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pendrake_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local persistence (PW-006). Plain bundled SQLite; confidentiality comes from
# column-level encryption, so no SQLCipher/OpenSSL toolchain is required.
# 0.37 to match the core's zcash_client_sqlite: only ONE libsqlite3-sys (links =
# "sqlite3") may exist in the graph, so the vault's rusqlite must track the core's.
rusqlite = { version = "0.37", features = ["bundled"] }

# Encryption-at-rest (PW-006): keychain master key + Argon2id + XChaCha20-Poly1305.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"

# Notifications (PW-051+): deep-link scheme + single-instance forwarding so a
# notification click launches/focuses the GUI. The single-instance plugin MUST be
# registered first; the `deep-link` feature makes it forward the URI to the running
# instance. Scheme is provisional ("pendrake://"), final value TBD with dorianvp.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# --- Zcash core (view-only) — Fase 1: validación criptográfica real de la VK ---
#
# Stack "Opción A" del blueprint: librustzcash nativo. Dependemos del fork
# `auzum197/librustzcash` fijado por commit (reproducible + CI-safe; NO `path`,
# que rompería el CI). Supply-chain verificado 2026-06-06: el commit `dad6ebe`
# existe idéntico en el canónico `zcash/librustzcash` (byte-a-byte, sin
# divergencia). View-only estricto: NO se importa UnifiedSpendingKey/USK.
zcash_keys = { git = "https://github.com/auzum197/librustzcash", rev = "dad6ebed5c0d8714a095667c7b10df749d5e44d2", features = [
    "sapling",
    "orchard",
    "transparent-inputs",
] }
zcash_protocol = { git = "https://github.com/auzum197/librustzcash", rev = "dad6ebed5c0d8714a095667c7b10df749d5e44d2" }

# --- Zcash core — Fase 2: conector gRPC a lightwalletd (PW-040) ---
# `zcash_client_backend` aporta el cliente gRPC generado (proto::service) y los
# tipos de mensaje. `tonic` (misma 0.14 que usa el backend) se necesita directo
# para construir el `Channel`/TLS (transport). Conector adaptado de
# zingolib/src/grpc_connector.rs (ver src/grpc.rs).
zcash_client_backend = { git = "https://github.com/auzum197/librustzcash", rev = "dad6ebed5c0d8714a095667c7b10df749d5e44d2", features = [
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
    # Must match zcash_keys' enabled pools, or zcb's cfg-gated code (e.g.
    # data_api/defaults.rs `UnifiedAddress::from_receivers`) mismatches and fails.
    "orchard",
    "transparent-inputs",
    # Fase 3b: the reference sync state machine (`zcash_client_backend::sync::run`).
    "sync",
] }
# --- Zcash core — Fase 3: store en memoria + import view-only + sync ---
# `zcash_client_memory` provee el store (MemoryWalletDb: WalletWrite +
# WalletCommitmentTrees) y un BlockCache en memoria (MemBlockCache). In-memory por
# ahora; el snapshot se cifrará con el vault en una sub-fase posterior (3c).
zcash_client_memory = { git = "https://github.com/auzum197/librustzcash", rev = "dad6ebed5c0d8714a095667c7b10df749d5e44d2", features = [
    "orchard",
    "transparent-inputs",
] }
# zcash_client_memory's MemoryWalletDb (the wallet store) is incomplete (v0.0.0,
# many todo!()), so for the real wallet store we use the production-grade
# `zcash_client_sqlite::WalletDb` over an in-memory SQLite (":memory:") — complete,
# handles reorg + transparent. We keep zcash_client_memory only for its MemBlockCache
# (a complete in-memory BlockCache). Persistence/encryption-at-rest = sub-phase 3c.
zcash_client_sqlite = { git = "https://github.com/auzum197/librustzcash", rev = "dad6ebed5c0d8714a095667c7b10df749d5e44d2", features = [
    "orchard",
    "transparent-inputs",
] }
# ChaChaRng (Clone) for WalletDb's required RngCore param.
rand_chacha = "0.3"
tonic = { version = "0.14", default-features = false, features = [
    "transport",
    # `tls-webpki-roots` only sets the root certs; rustls 0.23 also needs a crypto
    # provider selected, or it panics ("could not determine CryptoProvider"). `tls-ring`
    # picks ring process-wide (no C toolchain, unlike aws-lc).
    "tls-ring",
    "tls-webpki-roots",
] }

[dev-dependencies]
# For the #[tokio::test] live gRPC smoke tests in src/grpc.rs (ignored in CI).
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# Native desktop notification backends. These live behind cfg() so each platform
# pulls only its own dependency. The `notify` module is kept free of Tauri types
# so it can be lifted into dorianvp's `wallet-daemon` later (the daemon is the
# component that will actually fire these once background sync exists).
[target.'cfg(target_os = "windows")'.dependencies]
# WinRT toast with protocol activation (launch = "pendrake://...").
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
# org.freedesktop.Notifications via libnotify; default action opens the URI.
notify-rust = "4"

