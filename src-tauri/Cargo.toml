[package]
name = "pendrake-watch"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pendrake_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Local persistence (PW-006). Plain bundled SQLite; confidentiality comes from
# column-level encryption, so no SQLCipher/OpenSSL toolchain is required.
rusqlite = { version = "0.32", features = ["bundled"] }

# Encryption-at-rest (PW-006): keychain master key + Argon2id + XChaCha20-Poly1305.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
getrandom = "0.2"
zeroize = "1"

# Notifications (PW-051+): deep-link scheme + single-instance forwarding so a
# notification click launches/focuses the GUI. The single-instance plugin MUST be
# registered first; the `deep-link` feature makes it forward the URI to the running
# instance. Scheme is provisional ("pendrake://"), final value TBD with dorianvp.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Native desktop notification backends. These live behind cfg() so each platform
# pulls only its own dependency. The `notify` module is kept free of Tauri types
# so it can be lifted into dorianvp's `wallet-daemon` later (the daemon is the
# component that will actually fire these once background sync exists).
[target.'cfg(target_os = "windows")'.dependencies]
# WinRT toast with protocol activation (launch = "pendrake://...").
tauri-winrt-notification = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
# org.freedesktop.Notifications via libnotify; default action opens the URI.
notify-rust = "4"

