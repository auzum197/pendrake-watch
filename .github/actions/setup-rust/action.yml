name: Set up Rust
description: Install the toolchain pinned in rust-toolchain.toml, plus any extra targets.

inputs:
  targets:
    description: Comma-separated list of extra targets to install.
    default: ""

runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        components: rustfmt
        targets: ${{ inputs.targets }}
