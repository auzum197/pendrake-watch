name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (x86_64 + ARM64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Install protoc
        run: brew install protobuf

      - name: Build macOS helper
        run: scripts/build-macos-helper.sh
        env:
          PENDRAKE_HELPER_PROFILE: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        run: cargo build --locked --manifest-path crates/Cargo.toml -p pendrake-daemon --release

      - name: Stage daemon sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "crates/target/release/pendraked" "src-tauri/binaries/pendraked-$(rustc -vV | sed -n 's/host: //p')"

      - name: Build
        run: pnpm tauri build
        env:
          APPLE_SIGNING_IDENTITY: ""

      - name: Find and rename DMG
        run: |
          # Find the DMG (could be in dmg or macos directory)
          DMG=$(find src-tauri/target/release/bundle -name "*.dmg" -type f | head -1)

          if [ -z "$DMG" ]; then
            echo "Error: No DMG found"
            exit 1
          fi

          # Extract version from git tag
          VERSION="${{ github.ref }}"
          VERSION="${VERSION##*/v}"

          # Rename for release
          mv "$DMG" "Pendrake-Watch-${VERSION}.dmg"
          echo "DMG_PATH=Pendrake-Watch-${VERSION}.dmg" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_PATH }}
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            protobuf-compiler

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        run: cargo build --locked --manifest-path crates/Cargo.toml -p pendrake-daemon --release

      - name: Stage daemon sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "crates/target/release/pendraked" "src-tauri/binaries/pendraked-$(rustc -vV | sed -n 's/host: //p')"

      - name: Build
        run: pnpm tauri build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Install protoc
        run: choco install protoc -y

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build daemon
        run: cargo build --locked --manifest-path crates/Cargo.toml -p pendrake-daemon --release

      - name: Stage daemon sidecar
        run: |
          mkdir -p src-tauri/binaries
          cp "crates/target/release/pendraked.exe" "src-tauri/binaries/pendraked-$(rustc -vV | sed -n 's/host: //p').exe"
        shell: bash

      - name: Build
        run: pnpm tauri build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/msi/*.msi
          draft: false
          prerelease: ${{ contains(github.ref, 'rc') || contains(github.ref, 'beta') || contains(github.ref, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
