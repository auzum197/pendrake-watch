name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Rust job is the critical path and most PRs only touch src/, so it runs
  # only when something it compiles changed. A skipped job still satisfies a
  # required status check, which a workflow-level paths filter would not.
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "src-tauri/**"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
              - ".github/actions/**"

  typecheck-build:
    name: TypeScript typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11.5 requires Node >= 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      # Rules-of-React violations that would make a component bail out of
      # compiler memoization (babel-plugin-react-compiler runs in vite.config).
      - name: React Compiler lint
        run: pnpm lint:compiler

      # vite build does not typecheck and the unit tests need neither, so the
      # three run side by side. The Storybook browser tests stay out of CI: they
      # need a Playwright Chromium download and a second cache.
      - name: Typecheck, test and build
        run: |
          pnpm exec tsc --noEmit > "$RUNNER_TEMP/tsc.log" 2>&1 & tsc=$!
          pnpm exec vitest run --project unit > "$RUNNER_TEMP/vitest.log" 2>&1 & vitest=$!
          pnpm exec vite build > "$RUNNER_TEMP/vite.log" 2>&1 & vite=$!
          status=0
          for name in tsc vitest vite; do
            wait "${!name}" || { status=1; echo "::error::$name failed"; }
            echo "::group::$name"
            cat "$RUNNER_TEMP/$name.log"
            echo "::endgroup::"
          done
          exit "$status"

  check-format-and-test:
    name: Rust formatting and tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    env:
      # Halves the target directory, so the cache restores and saves faster and
      # the big binaries link faster. Backtraces keep their line numbers.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      # Compile-unit cache on top of rust-cache's target cache. A Cargo.lock bump
      # recompiles only the crates that changed instead of everything.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4

      # The Tauri crate needs webkit2gtk and gtk to compile on Linux, and the
      # pinned lightwallet-protocol regenerates its gRPC stubs at build time,
      # which needs protoc. apt runs in the background so it overlaps with the
      # toolchain install and the cache restore. The step below waits on it.
      # Tray and bundler libraries are left out: the tray feature is off and
      # nothing bundles here.
      - name: Start installing the Tauri system dependencies
        run: |
          nohup sh -c '
            sudo apt-get -o Acquire::Retries=3 update &&
            sudo apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=120 install -y --no-install-recommends \
              libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev protobuf-compiler
            echo $? > "$RUNNER_TEMP/apt.status"
          ' > "$RUNNER_TEMP/apt.log" 2>&1 &

      - uses: ./.github/actions/setup-rust

      - uses: rui314/setup-mold@v1

      - uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Wait for the Tauri system dependencies
        run: |
          until [ -f "$RUNNER_TEMP/apt.status" ]; do sleep 2; done
          if [ "$(cat "$RUNNER_TEMP/apt.status")" != 0 ]; then
            cat "$RUNNER_TEMP/apt.log"
            exit 1
          fi

      # src-tauri's build script needs the pendraked sidecar (externalBin) to exist, so
      # build the daemon and stage it under the target-triple name Tauri expects. This
      # also proves the crates workspace compiles.
      - name: Build and stage the daemon sidecar
        run: |
          cargo build --locked --manifest-path crates/Cargo.toml -p pendrake-daemon
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          cp "crates/target/debug/pendraked" "src-tauri/binaries/pendraked-${triple}"

      - name: Tests (crates)
        working-directory: crates
        run: cargo test --locked

      - name: Tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked
