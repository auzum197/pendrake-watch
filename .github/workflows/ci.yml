name: CI

on:
  push:
    branches: [test, main]
  pull_request:
    branches: [test, main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # pnpm 11.5 requires Node >= 22.13
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck + build
        run: pnpm build

  backend:
    name: Backend (fmt + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Tauri crate needs these system libraries to compile on Linux.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates
            src-tauri

      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --all --check

      # src-tauri's build script needs the pendraked sidecar (externalBin) to exist, so
      # build the daemon and stage it under the target-triple name Tauri expects. This
      # also proves the crates workspace compiles.
      - name: Build and stage the daemon sidecar
        run: |
          cargo build --locked --manifest-path crates/Cargo.toml -p pendrake-daemon
          triple=$(rustc -vV | sed -n 's/host: //p')
          mkdir -p src-tauri/binaries
          cp "crates/target/debug/pendraked" "src-tauri/binaries/pendraked-${triple}"

      - name: Tests (crates)
        working-directory: crates
        run: cargo test --locked

      - name: Tests (src-tauri)
        working-directory: src-tauri
        run: cargo test --locked
