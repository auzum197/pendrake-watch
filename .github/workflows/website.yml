name: Website

on:
  push:
    branches: [test, main]
    paths: &website-paths
      - "website/**"
      - "src/assets/**"
      - "src/components/app/reveal.css"
      - "src/components/dashboard/dither/**"
      - "src-tauri/icon-composer/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: [test, main]
    paths: *website-paths

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SITE_URL: https://pendrake.app

jobs:
  check-build:
    name: Website checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      STORYBOOK_DISABLE_TELEMETRY: 1
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm fmt:check

      - name: React Compiler lint
        run: pnpm lint:compiler

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Upload site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: website/dist

  deploy:
    name: Deploy website
    needs: check-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: website-pages
